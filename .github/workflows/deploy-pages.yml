name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - name: Verify Drift web assets are present
        run: |
          test -f web/sqlite3.wasm
          test -f web/drift_worker.js

      - name: Build web release
        run: flutter build web --release --no-wasm-dry-run --base-href "/remember_last/"

      - name: Include privacy policy static page
        run: mkdir -p build/web/privacy && cp -r web/privacy/* build/web/privacy/

      - name: Add SPA fallback for client-side routing
        run: cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
