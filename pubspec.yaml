name: remember_last
description: "Offline-first Last Done Tracker — remember when you last did anything."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.9
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  file_picker: ^12.2.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.1
  intl: ^0.20.3
  mixpanel_flutter: ^2.13.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/app_logo_light.png
    - docs/privacy_policy.md
