name: remember_last
description: "Offline-first Last Done Tracker — remember when you last did anything."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^2.6.1
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  sqlite3: ^3.4.0
  intl: ^0.20.3
  go_router: ^17.3.0
  fl_chart: ^1.2.0
  file_picker: ^12.0.0-beta.7
  share_plus: ^13.2.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.4
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
